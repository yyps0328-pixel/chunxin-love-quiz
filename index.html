body{margin:0;background:radial-gradient(ellipse at 85% 36%,#f6e8d7aa,transparent 56%),var(--paper);color:var(--ink);font:1rem/1.7 var(--sans);min-height:100svh;display:flex;flex-direction:column}main{flex:1}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible+span{outline:3px solid #78672e;outline-offset:4px}button:disabled{cursor:default}button,.option{touch-action:manipulation}[hidden]{display:none!important}.mast,footer{width:min(89%,1180px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between}.mast{padding:22px 0 18px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font:700 1.48rem/1.2 var(--serif);letter-spacing:.12em}.brand small{display:block;margin-top:4px;letter-spacing:.17em;font:600 .65rem/1.3 Georgia,serif;color:var(--muted)}.seal,.art-seal,.tiny-seal{font-family:var(--serif);background:var(--red);color:#fff0db;text-align:center}.seal{font-size:.99rem;line-height:1.08;letter-spacing:.05em;padding:4px 3px;border-radius:4px 2px 5px 2px;outline:1px solid var(--red);outline-offset:2px;margin:3px}.mast-note,.kicker,.eyebrow{font-size:.875rem;letter-spacing:.12em}.mast-note{color:var(--muted)}.home{width:min(85%,1080px);margin:clamp(36px,6vh,74px) auto;display:grid;grid-template-columns:1fr .91fr;align-items:center;gap:6%}.eyebrow,.kicker{color:var(--red);font-weight:600}.eyebrow{display:flex;align-items:center;gap:12px;margin:0}.eyebrow i,footer i{display:inline-block;width:26px;height:1px;background:currentColor;opacity:.65}h1,h2,h3,p,figure{margin:0}h1{font:600 clamp(3.4rem,5.3vw,5.2rem)/1.18 var(--serif);letter-spacing:.045em;margin:26px 0 22px}h1 em{font-style:normal;color:var(--red)}.lead{line-height:1.95;color:#5f504b;font-size:1.025rem}.facts{display:flex;gap:0;margin:27px 0 29px}.facts div{padding:0 22px;border-left:1px solid var(--line)}.facts div:first-child{padding-left:0;border:0}.facts b,.facts span{display:block}.facts b{font:normal 1.65rem/1.15 Georgia,serif}.facts span{font-size:.84rem;color:var(--muted);margin-top:4px}.primary{background:var(--red);color:#fff9f0;border:1px solid var(--red);padding:11px 29px;min-height:46px;font-weight:600;letter-spacing:.05em;border-radius:3px;transition:background .18s,transform .18s}.primary:hover:enabled{background:#79313c}.primary:active:enabled{transform:translateY(1px)}.primary:disabled{background:#e1d7cb;color:#655a52;border-color:#d4c8ba}#start{min-width:209px}.postcard{padding:10px 10px 0;background:#fff9ec;border:1px solid #cdbaa4;box-shadow:6px 7px 0 -2px #e5d9c9,7px 8px 0 -2px #cdbdaa,0 14px 32px #60463615;transform:rotate(1.3deg);width:100%;max-width:444px;justify-self:center}.artwrap{position:relative;background:#efd2b5}.artwrap canvas{width:100%;height:auto;display:block}.art-label,.art-seal{position:absolute;writing-mode:vertical-rl}.art-label{top:6%;right:8%;color:#513b36;font:600 clamp(1.15rem,1.9vw,1.75rem)/1 var(--serif);letter-spacing:.19em}.art-seal{left:7%;bottom:8%;writing-mode:horizontal-tb;line-height:1.08;padding:4px 3px;font-size:.82rem;outline:1px solid var(--red);outline-offset:2px}figcaption{display:flex;align-items:center;gap:12px;padding:10px 6px;font:.82rem var(--serif);letter-spacing:.15em;color:#6d534b}.caption-line{height:1px;flex:1;background:#d3c3ac}footer{border-top:1px solid var(--line);padding:15px 0 19px;color:var(--muted);font-size:.78rem;gap:12px}footer span:first-child{display:flex;align-items:center;gap:9px}footer i{width:12px}
.quiz,.result{width:min(90%,740px);margin:clamp(24px,5vh,54px) auto}.quiz{padding:clamp(24px,4vw,48px);background:#fffbf3;border:1px solid var(--line);box-shadow:0 9px 32px #6851380b}.quiz-top,.actions,.report-head,.result-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}#count{font:1rem Georgia,var(--serif);font-variant-numeric:tabular-nums;color:var(--muted)}progress{width:100%;display:block;appearance:none;border:0;margin:13px 0 28px;height:4px;border-radius:5px;overflow:hidden;background:#e9dfd0}progress::-webkit-progress-bar{background:#e9dfd0}progress::-webkit-progress-value{background:var(--red);transition:width .25s}progress::-moz-progress-bar{background:var(--red)}#question{font:600 clamp(1.45rem,2.7vw,2rem)/1.55 var(--serif);outline:none;margin-bottom:23px}fieldset{border:0;padding:0;margin:0;min-width:0;display:grid;gap:10px}.option{display:block;position:relative;cursor:pointer}.option input{position:absolute;opacity:0}.option>span{display:flex;align-items:center;gap:14px;border:1px solid #d9cfc1;background:#fffdf7;padding:12px 15px;border-radius:3px;transition:background .15s,border-color .15s}.option b{flex:0 0 25px;text-align:center;font:normal 1.05rem Georgia,serif;color:#867366;border-right:1px solid var(--line);padding-right:10px}.option:hover>span{border-color:#ad8280}.option input:checked+span{background:#f5e5df;border-color:var(--red);box-shadow:inset 3px 0 var(--red)}.option input:checked+span b{color:var(--red)}.actions{margin-top:25px}.plain{background:transparent;color:var(--red);border:0;padding:10px 4px;text-decoration:underline;text-underline-offset:5px}.plain:disabled{color:#a69b90;text-decoration:none}.reveal{animation:arrive .23s ease-out}@keyframes arrive{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
#report{position:relative;background:linear-gradient(130deg,#fff9ea,#f7e6d7);border:1px solid #c7aa92;padding:clamp(23px,5vw,45px);outline:1px solid #dbbfa9;outline-offset:-7px}.tiny-seal{padding:2px 5px;font-size:.88rem}.report-head{border-bottom:1px solid #c9ad98;padding-bottom:13px}#type{font:600 clamp(2.1rem,5vw,3.4rem)/1.3 var(--serif);letter-spacing:.05em;color:var(--red);margin:22px 0 9px;outline:0}#motto{font:1.14rem/1.7 var(--serif)}#tags{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0 21px}#tags span{color:#79404a;font-size:.8rem;border:1px solid #cdaaa0;border-radius:2px;padding:1px 8px}.report-grid{display:grid;grid-template-columns:1.28fr 1fr;gap:22px}h3{font:600 1.15rem/1.6 var(--serif);margin-bottom:5px}.report-grid p,.egg p,.reason p{line-height:1.75;color:#594d46}.egg{margin-top:17px;padding-top:11px;border-top:1px solid #d8c1ae}.reason{margin:24px 0}.reason h3{color:var(--red)}#scores{display:grid;gap:6px;margin-top:11px}.score-row{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:.875rem;border-bottom:1px solid var(--line);padding:4px 0}.score-row span{color:var(--muted)}.hint{font-size:.82rem;color:var(--muted)}#tie:not(:empty),#save-note:not(:empty){margin-top:10px}.result-actions{justify-content:flex-start;gap:24px}
@media(max-width:700px){.mast,footer{width:89%}.mast{padding:15px 0}.home{width:89%;gap:24px;grid-template-columns:1fr;margin:24px auto 30px}.intro{display:contents}.eyebrow{grid-row:1}.home h1{grid-row:2;margin:-12px 0 0;font-size:clamp(2.55rem,9.2vw,3.85rem)}.home h1 br{display:block}.postcard{grid-row:3;max-width:100%;transform:rotate(.6deg);padding:6px 6px 0}.artwrap{height:clamp(148px,48vw,260px);overflow:hidden}.artwrap canvas{height:100%;object-fit:cover;object-position:50% 46%}.art-label{font-size:1.18rem;right:5%}.art-seal{left:4%;bottom:10%}figcaption{padding:7px 5px}.lead{grid-row:4;font-size:1rem;line-height:1.7}.facts{grid-row:5;margin:-6px 0}.facts div{padding:0 20px}.facts b{font-size:1.45rem}#start{grid-row:6;width:100%}footer{flex-wrap:wrap;gap:5px;padding:13px 0}.quiz,.result{width:92%;margin:20px auto}.quiz{padding:22px 17px}.report-grid{grid-template-columns:1fr;gap:13px}.actions{margin-top:20px}.option>span{padding:11px;gap:10px}progress{margin-bottom:20px}.result-actions>.primary{flex:1}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
dialog{width:min(92vw,460px);max-height:93svh;padding:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:5px}dialog::backdrop{background:#2d1d20a8}dialog img{display:block;max-width:100%;max-height:64svh;width:auto;height:auto;margin:0 auto 9px}dialog p{text-align:center}dialog .actions{margin:12px 0 0}dialog a.primary{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}</style></head>
<body><header class="mast"><div class="brand"><span class="seal" aria-hidden="true">春信<br>手记</span><span>春信笺<small>LETTERS IN BLOOM</small></span></div><span class="mast-note">恋爱人格手记</span></header>
<main>
<section id="home" class="home">
<div class="intro"><p class="eyebrow">春日来信 <i></i> 恋爱人格测试</p>
<h1>你的心动，<br><em>如何落款？</em></h1>
<p class="lead">喜欢的人发来一句「想见你」。<br>你会说出口，还是先向对方走一步？</p>
<div class="facts"><div><b>40</b><span>道情境题</span></div><div><b>6–8</b><span>分钟左右</span></div><div><b>8</b><span>种心动人格</span></div></div>
<button class="primary" id="start">拆信，开始测试</button></div>
<figure class="postcard"><div class="artwrap"><canvas id="art" role="img" aria-label="一对春燕掠过圆月，红梅从远山间横斜入画"></canvas><span class="art-label">双燕衔春</span><span class="art-seal" aria-hidden="true">春<br>信</span></div><figcaption><span>双燕衔春图</span><span class="caption-line"></span><span>春信笺藏</span></figcaption></figure></section>
<section id="quiz" class="quiz" hidden><div class="quiz-top"><span id="chapter" class="kicker"></span><span id="count"></span></div><progress id="progress" max="40" value="0" aria-label="已作答题数"></progress>
<div id="question-body"><h2 id="question" tabindex="-1"></h2><fieldset id="options" aria-labelledby="question"></fieldset></div>
<div class="actions"><button class="plain" id="back">上一题</button><button class="primary" id="next" disabled>下一题</button></div></section>
<section id="result" class="result" hidden><article id="report"><div class="report-head"><span class="kicker">春信笺 · 心动人格签</span><span class="tiny-seal" aria-hidden="true">印</span></div><h2 id="type" tabindex="-1"></h2><p id="motto"></p><div id="tags"></div><div class="report-grid"><section><h3>性格特点</h3><p id="traits"></p></section><section><h3>隐藏优势</h3><p id="gift"></p></section></div><div class="egg"><h3>笺中彩蛋</h3><p id="egg"></p></div></article>
<section class="reason"><h3>这封签为什么属于你</h3><p id="evidence"></p><div id="scores"></div><p id="tie" class="hint"></p></section><div class="result-actions"><button class="primary" id="save">生成分享图</button><button class="plain" id="restart">重新测试</button></div><p id="save-note" role="status" class="hint"></p></section></main><dialog id="share-dialog" aria-label="分享人格签"><img id="share-image" alt="我的春信笺人格分享图"><p class="hint">手机可长按图片保存</p><div class="actions"><button class="plain" id="close-share">返回结果</button><a id="download" class="primary">下载 PNG 图片</a></div></dialog>
<footer><span>春信笺 <i></i> 趣味人格测试</span><span>仅供娱乐与自我探索，不作专业心理诊断。</span></footer><script>const questions = [
  {"axes":[0,1],"text":"晚上十点，喜欢的人发来一句「想见你」。你怎么回？","options":["我也想你。刚才对着聊天框练习了三遍。","我也想见你。明晚那家面馆？我来订位。","有多想？说来听听。","拍下散步路上的空长椅，把位置发过去。"]},
  {"axes":[1,2],"text":"早餐摊前多出十分钟，你想给对方一点惊喜。","options":["把昨晚想好的早安谜语发过去。","照着菜单名，临时编一句只有你俩懂的早安。","照收藏的口味单，带一份刚出锅的早餐。","看到新口味的包子，顺手给对方捎一个。"]},
  {"axes":[0,2],"text":"你们通勤有一段顺路。你想多走几天这条路。","options":["直接提议每周三在同一个站口见。","今天刚好碰上，就说「一起走一段吧」。","记住对方常坐的车次，在站台上自然打招呼。","偶然同路时放慢脚步，让话题自己长出来。"]},
  {"axes":[0,1],"text":"晚饭后，对方说「今天有点累」。你下意识会？","options":["直接问「想跟我讲讲吗？我有时间听」。","问一句「我能帮你什么？」随手接过碗筷。","顺着刚才的话，轻轻问「是下午那件事吗？」","把电视音量调低，往旁边挪出舒服的位置。"]},
  {"axes":[1,2],"text":"你想把两个人的日常留下来，会怎么做？","options":["在每周日写三句话，记住这一周的小事。","聊天里冒出好句子就记下来，攒成语录。","固定每个月洗一张照片，贴进相册。","路过拍贴机就进去，把刚拍的照片塞进钱包。"]},
  {"axes":[0,2],"text":"周末早上醒来，天气比预报好得多。","options":["发起出门邀约，连集合时间和地点一起说。","推开窗拍张照，直接问「现在去晒太阳吗？」","等对方提起出门，把收藏好的公园路线发过去。","对方说想走走，就穿鞋下楼，看风往哪边吹。"]},
  {"axes":[0,1],"text":"聊天时发现，你们都爱同一家小店。","options":["坦白说「又多一个想约你吃饭的理由」。","当场邀请一起去，把能订的座位找出来。","顺着对方推荐的菜，聊起自己最喜欢的那一口。","下次经过时捎一份对方提过的点心。"]},
  {"axes":[1,2],"text":"睡前只剩五分钟，你想留一点联系。","options":["按习惯发一段晚安语音，讲今天最好的小事。","随口讲刚想到的冷笑话，笑完就说晚安。","把对方明早要带的东西放到门口。","看见手机快没电了，顺手替对方插好充电线。"]},
  {"axes":[0,2],"text":"第一次约会的餐厅临时关门了。你会？","options":["告诉对方「我有备选」，带路去第二家。","提议拐进下一条街，选第一家闻起来香的店。","先听对方的意见，再翻出事先存的两家店。","跟着对方逛，走到都想停的地方就吃。"]},
  {"axes":[0,1],"text":"两个人约错了地铁出口，隔着一条大马路。","options":["先打电话说明白「我想快点见到你，我们这样走」。","主动发一句「站那儿等我」，过街去接。","沿着对方报出的地标，一句句对位置。","看清对方站的方向，举起手里的花让人认出来。"]},
  {"axes":[1,2],"text":"挑一份纪念日礼物，你更愿意花心思在哪儿？","options":["提前写封信，每一段都讲一件共同经历。","想到一个好玩的梗，就录成当下的专属语音。","翻看愿望清单，提前备好提过很久的小物。","逛街撞见特别像对方的东西，就选它。"]},
  {"axes":[0,2],"text":"你们要一起做一顿饭。哪种开场最自然？","options":["我来定菜谱，咱俩照采购清单分头拿。","我提议玩个游戏，各抓一样食材再决定做什么。","等你挑主菜，我按之前存的方子配齐食材。","你先动手，我看看冰箱里有什么能搭上。"]},
  {"axes":[0,1],"text":"旅行中你想多留一天，对方还在犹豫。","options":["直接讲出舍不得走的原因，听听对方怎么想。","坦白想留下，先帮两个人查好改签方案。","顺着对方的顾虑聊，等话头合适再说自己的期待。","把第二天互不耽误的行程排出来，递给对方看。"]},
  {"axes":[1,2],"text":"两人分工做旅行攻略，你最乐意接哪一项？","options":["提前把每一天写成一小段导览词。","到了地方即兴当解说，看到什么聊什么。","搞定车次、门票和每天第一站的时间。","负责边走边探店，随时带大家拐个弯。"]},
  {"axes":[0,2],"text":"约好的野餐碰上雨天，你想把今天过好。","options":["提议换到提前收藏的温室，顺手确认开放时间。","直接说「下雨也好玩」，临时发起室内野餐。","先听听对方想法，再拿出备好的雨天清单。","对方想在哪儿躲雨就在哪儿坐，点心照样分着吃。"]},
  {"axes":[0,1],"text":"你们订到的两个座位隔着过道，你想坐近一点。","options":["坦白说想坐一起，问对方介不介意换座。","主动走到服务台，问问有没有连在一起的空位。","听对方说完坐哪儿都行，再小声讲自己的想法。","等旁边出现空位，拍拍椅背让对方看过来。"]},
  {"axes":[1,2],"text":"聚会上要给寿星送祝福，你想和对方一起准备。","options":["提前合写几句，把两个人想说的话编进去。","到现场一人接一句，即兴讲段小相声。","提前备好两人合做的小礼物，包得整整齐齐。","就地拿彩纸和丝带，一起临场做顶生日帽。"]},
  {"axes":[0,2],"text":"想带喜欢的人认识自己的朋友，你会怎么约？","options":["主动约好小范围晚餐，提前介绍在场的人。","看到大家都在附近，开口邀请对方过来坐坐。","等对方提到想认识谁，再挑个合适的日子。","碰巧遇到熟人，就自然地把两边介绍给彼此。"]},
  {"axes":[0,1],"text":"一群人聊天，对方的笑话只有你听懂了。","options":["直接夸「我听懂了，这句太妙了」。","主动举杯和对方碰一下，给个明晃晃的回应。","等大家换话题，轻声接上笑话的下半句。","隔着人群对上眼，做一个只有你俩懂的手势。"]},
  {"axes":[1,2],"text":"你们有个共同群聊，你最想留下哪种传统？","options":["每周抛出一个好问题，大家轮流答。","谁想出有意思的接龙，谁就开个头。","固定每月组一次散步局，提前约好地点。","有人路过好玩的地方，就发位置随缘碰头。"]},
  {"axes":[0,2],"text":"舞会放起一首两个人都熟悉的歌。","options":["直接邀舞，从事先练过的第一步开始。","伸手就邀「来呀」，跳错也顺着节拍转个圈。","等到熟悉的副歌，看对方点头再跟上练过的步子。","接住对方伸来的手，对方怎么晃就怎么晃。"]},
  {"axes":[0,1],"text":"对方在饭桌上一直插不上话。你会？","options":["主动把话题递过去：「我想听听你的版本。」","挪把椅子坐到身边，主动让出自己的位置。","等对方开口时接一句，帮那句话顺畅地说下去。","等大家看过来时放下筷子，把注意力留给对方。"]},

function signsOf(option) { return [option < 2 ? 1 : -1, option % 2 === 0 ? 1 : -1]; }
function evaluate(picks) {
  if (picks.length !== questions.length || picks.some(v => !Number.isInteger(v) || v < 0 || v > 3)) throw Error('请先完成所有题目');
  const totals = dimensions.map(() => ({plus:0,minus:0,last:0}));
  questions.forEach((q,i) => {
    const signs = signsOf(picks[i]);
    q.axes.forEach((axis,k) => {
      const score = totals[axis];
      score[signs[k] > 0 ? 'plus' : 'minus']++;
      score.last = signs[k];
    });
  });
  // An exact tie follows the last answer involving that dimension.
  const directions = totals.map(t => Math.sign(t.plus - t.minus) || t.last);
  const key = directions.map(d => d > 0 ? '+' : '-').join('');
  return {key,totals,directions,tags:directions.map((s,i) => dimensions[i][s>0?'plus':'minus'])};

  $('options').replaceChildren();
  // Rotate the four scoring combinations so a fixed screen position carries no fixed trait.

    row.append(title,data);return row;
  }));
  const ties=result.totals.flatMap((t,i)=>t.plus===t.minus?[dimensions[i].name]:[]);
  $('tie').textContent = ties.length ? ties.join('、')+'两侧同分，按最后一道涉及该维度的回答确定本次落款。' : '';
  $('save-note').textContent='';show('result');$('type').focus({preventScroll:true});
}
function begin() {answers.fill(null);current=0;lastResult=null;show('quiz');renderQuestion();}
$('start').addEventListener('click', begin);$('restart').addEventListener('click',begin);
$('back').addEventListener('click',()=>{if(current>0){current--;renderQuestion();}});
$('next').addEventListener('click',()=>{
  if(answers[current]===null)return;
  if(current===questions.length-1)fillReport();
  else{current++;renderQuestion();}
});
function shareCard(result) {
  const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;
  const c=canvas.getContext('2d'),[name,motto,traits,gift,egg]=profiles[result.key];
  const serif='"Songti SC","SimSun",serif',sans='"Microsoft YaHei","PingFang SC",sans-serif';
  c.fillStyle='#fbf1e2';c.fillRect(0,0,900,1200);
  c.strokeStyle='#b2947e';c.lineWidth=1.5;c.strokeRect(25,25,850,1150);
  const art=$('art');c.save();c.beginPath();c.rect(43,43,814,220);c.clip();
  c.drawImage(art,0,325,art.width,395,43,43,814,250);c.restore();
  function line(text,x,y,size,color,family){c.fillStyle=color;c.font=size+'px '+family;c.fillText(text,x,y);}
  function paragraph(text,y,size,leading,family=sans){
    c.fillStyle='#51453e';c.font=size+'px '+family;let row='';
    for(const char of text){if(c.measureText(row+char).width>742 && row){c.fillText(row,78,y);y+=leading;row='';}row+=char;}
    c.fillText(row,78,y);return y+leading;
  }
  line('春信笺  /  心动人格签',78,323,24,'#7f5960',serif);
  line(name,74,422,72,'#903e4b',serif);
  let y=paragraph(motto,486,31,45,serif);
  line(result.tags.join('   ·   '),78,y+11,23,'#914956',sans);y+=82;
  for(const [heading,copy] of [['性格特点',traits],['隐藏优势',gift],['笺中彩蛋',egg]]){
    line(heading,78,y,30,'#903e4b',serif);y=paragraph(copy,y+47,26,40)+32;
  }
  line('春信笺  ·  趣味人格测试，仅供娱乐与自我探索。',78,1133,20,'#73675c',sans);
  return canvas;
}
$('save').addEventListener('click',()=>{
  if(!lastResult)return;
  try {
    const png=shareCard(lastResult).toDataURL('image/png');
    $('share-image').src=png;
    $('download').href=png;
    $('download').download='春信笺-'+profiles[lastResult.key][0]+'.png';
    $('share-dialog').showModal();
  } catch { $('save-note').textContent='此浏览器未能打开分享图，可直接截取上方人格签。'; }
});
$('close-share').addEventListener('click',()=>$('share-dialog').close());
